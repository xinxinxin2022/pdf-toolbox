<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDFToolBox - Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=/#/">
  <link rel="canonical" href="https://pdf-toolbox.asia/" />
</head>
<body>
  <p>Redirecting to <a href="/#/">PDFToolBox</a>...</p>
  <script>
    // Preserve the path for SPA routing
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/#/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/'));
  </script>
</body>
</html>
