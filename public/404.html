<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDFToolBox</title>
  <meta name="robots" content="noindex, follow">
  <script>
    // SPA redirect for GitHub Pages history mode
    // Redirects all unknown paths to index.html with path preserved as query param
    (function() {
      var l = window.location;
      // Avoid redirect loops
      if (l.search.indexOf('_path=') === -1) {
        var path = encodeURIComponent(l.pathname);
        var search = l.search ? '&' + l.search.slice(1) : '';
        var hash = l.hash || '';
        var target = '/?_path=' + path + search + hash;
        // Use meta-refresh style redirect (Google follows these)
        window.location.replace(target);
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/?_path=/">
  </noscript>
</head>
<body>
  <p>Loading...</p>
  <p>If you are not redirected, <a href="/?_path=/">click here</a>.</p>
</body>
</html>
